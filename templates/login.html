
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarmlessAI Admin Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #101827;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }
        .login {
            width: min(90%, 390px);
            padding: 32px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
        }
        h1 { color: #38bdf8; margin-top: 0; }
        p { color: #94a3b8; }
        input, button {
            width: 100%;
            padding: 13px;
            margin-top: 14px;
            border-radius: 7px;
            font-size: 15px;
        }
        input {
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
        }
        button {
            background: #0284c7;
            border: 0;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #0369a1; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <main class="login">
        <h1>HarmlessAI</h1>
        <p>Administrator Dashboard</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
	<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input
                type="password"
                name="password"
                placeholder="Administrator password"
                autocomplete="current-password"
                required
            >
            <button type="submit">Sign In</button>
        </form>
    </main>
</body>
</html>
